name: Build prototype

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Remove old generated pages
        run: |
          find . -maxdepth 1 -type f -name "*.html" -delete

      - name: Build prototype
        run: npm run build

      - name: Show generated pages
        run: |
          echo "Generated HTML files:"
          ls -la *.html

      - name: Save generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          git diff --cached --quiet || git commit -m "Build prototype"
          git push
